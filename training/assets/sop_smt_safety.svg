<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a085" />
      <stop offset="100%" stop-color="#1abc9c" />
    </linearGradient>
  </defs>
  
  <rect x="5" y="5" width="790" height="440" rx="12" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Header Banner -->
  <rect x="5" y="5" width="790" height="65" rx="12" fill="url(#headerGrad)"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff">TIÊU CHUẨN THAO TÁC (SOP) | AN TOÀN VẬN HÀNH MÁY SMT</text>
  <text x="650" y="42" font-family="monospace" font-size="14" fill="#e8f8f5">MÃ: SOP-SMT-001</text>
  
  <!-- Step 1 Card -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="165" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="40" rx="8" fill="#3b82f6"/>
    <text x="82" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff">BƯỚC 1: TRANG BỊ</text>
    <circle cx="82" cy="100" r="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <!-- Wrist strap icon -->
    <circle cx="82" cy="100" r="24" fill="none" stroke="#2563eb" stroke-width="4"/>
    <line x1="82" y1="124" x2="82" y2="155" stroke="#ef4444" stroke-width="3" stroke-dasharray="3 2"/>
    <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Đeo vòng ESD</text>
    <text x="82" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Cắm dây nối đất</text>
    <text x="82" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Kiểm tra điện trở &lt; 1MΩ</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="165" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="40" rx="8" fill="#10b981"/>
    <text x="82" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff">BƯỚC 2: KHÍ NÉN</text>
    <circle cx="82" cy="100" r="40" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <!-- Pressure icon -->
    <circle cx="82" cy="100" r="26" fill="#fff" stroke="#059669" stroke-width="3"/>
    <line x1="82" y1="100" x2="96" y2="86" stroke="#dc2626" stroke-width="3"/>
    <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Mở van khí nén</text>
    <text x="82" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Đồng hồ: 0.5 - 0.6 MPa</text>
    <text x="82" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Không rò rỉ khí</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(410, 90)">
    <rect x="0" y="0" width="165" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="40" rx="8" fill="#f59e0b"/>
    <text x="82" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff">BƯỚC 3: BẬT NGUỒN</text>
    <circle cx="82" cy="100" r="40" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <!-- Switch icon -->
    <circle cx="82" cy="100" r="22" fill="#d97706"/>
    <path d="M 82 88 L 82 98" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Khởi động Main Switch</text>
    <text x="82" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Đăng nhập tài khoản</text>
    <text x="82" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Load File Model</text>
  </g>

  <!-- Step 4 Card -->
  <g transform="translate(600, 90)">
    <rect x="0" y="0" width="165" height="320" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="0" y="0" width="165" height="40" rx="8" fill="#ef4444"/>
    <text x="82" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff">BƯỚC 4: VẬN HÀNH</text>
    <circle cx="82" cy="100" r="40" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <!-- Stop button warning icon -->
    <polygon points="82,82 104,118 60,118" fill="#dc2626"/>
    <text x="82" y="112" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff">!</text>
    <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e293b">Đóng nắp an toàn</text>
    <text x="82" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Nhớ vị trí E-STOP</text>
    <text x="82" y="220" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Bấm START vận hành</text>
  </g>
</svg>

