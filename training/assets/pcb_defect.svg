<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- PCB Green Mask -->
    <linearGradient id="pcbMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5345" />
      <stop offset="100%" stop-color="#0e6251" />
    </linearGradient>
    <!-- IC Body -->
    <linearGradient id="icGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#17202a" />
    </linearGradient>
    <filter id="pcbShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- PCB Base Substrate -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#pcbMask)" stroke="#117a65" stroke-width="4" filter="url(#pcbShadow)" />

  <!-- Mounting Holes with Copper Rings -->
  <circle cx="50" cy="50" r="14" fill="#d4ac0d" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="50" cy="50" r="9" fill="#000"/>
  <circle cx="750" cy="50" r="14" fill="#d4ac0d" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="750" cy="50" r="9" fill="#000"/>
  <circle cx="50" cy="450" r="14" fill="#d4ac0d" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="50" cy="450" r="9" fill="#000"/>
  <circle cx="750" cy="450" r="14" fill="#d4ac0d" stroke="#f1c40f" stroke-width="2"/>
  <circle cx="750" cy="450" r="9" fill="#000"/>

  <!-- Silk Screen Markings -->
  <text x="60" y="65" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ecf0f1">REV 4.2 | MAINBOARD SMT ASSY</text>
  <text x="600" y="65" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ecf0f1">QC INSPECTION STATION</text>

  <!-- Copper Bus Tracks -->
  <path d="M 80 120 L 220 120 L 250 160 L 320 160" fill="none" stroke="#27ae60" stroke-width="4" opacity="0.6"/>
  <path d="M 80 140 L 210 140 L 240 180 L 320 180" fill="none" stroke="#27ae60" stroke-width="3" opacity="0.6"/>
  <path d="M 480 180 L 580 180 L 620 130 L 720 130" fill="none" stroke="#27ae60" stroke-width="4" opacity="0.6"/>
  <path d="M 480 280 L 590 280 L 630 350 L 720 350" fill="none" stroke="#27ae60" stroke-width="3" opacity="0.6"/>

  <!-- ============================================================== -->
  <!-- IC1 (MAIN MCU) - AT CENTER: x=400 (50%), y=220 (44%)           -->
  <!-- DEFECT: Misaligned / Twisted IC with solder bridge on right pins -->
  <!-- Target polygon: (41%, 33%) to (59%, 55%) -> (328, 165) to (472, 275) -->
  <!-- ============================================================== -->
  <g id="ic-defect-area">
    <!-- Copper Pads on PCB (Straight) -->
    <rect x="325" y="160" width="150" height="120" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- IC Body Shifted and Rotated by -4 degrees (Defect) -->
    <g transform="rotate(-5, 400, 220)">
      <!-- IC Solder Pins (Left Side) -->
      <g fill="#bdc3c7">
        <rect x="315" y="175" width="22" height="6" rx="1"/>
        <rect x="315" y="190" width="22" height="6" rx="1"/>
        <rect x="315" y="205" width="22" height="6" rx="1"/>
        <rect x="315" y="220" width="22" height="6" rx="1"/>
        <rect x="315" y="235" width="22" height="6" rx="1"/>
        <rect x="315" y="250" width="22" height="6" rx="1"/>
      </g>
      <!-- IC Solder Pins (Right Side - DEFECT: Solder Bridge & Displaced) -->
      <g fill="#bdc3c7">
        <rect x="463" y="175" width="22" height="6" rx="1"/>
        <!-- Solder Bridge Blobs (Chập chì hàn) -->
        <ellipse cx="474" cy="197" rx="14" ry="11" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1.5"/>
        <rect x="463" y="190" width="22" height="6" rx="1" fill="#7f8c8d"/>
        <rect x="463" y="205" width="22" height="6" rx="1" fill="#7f8c8d"/>
        <!-- Bent Pin -->
        <polygon points="463,220 488,225 486,231 463,226" fill="#e74c3c"/>
        <rect x="463" y="235" width="22" height="6" rx="1"/>
        <rect x="463" y="250" width="22" height="6" rx="1"/>
      </g>

      <!-- IC Body Rectangle -->
      <rect x="335" y="170" width="130" height="100" rx="4" fill="url(#icGradient)" stroke="#1a252f" stroke-width="2" filter="url(#pcbShadow)"/>
      <circle cx="348" cy="183" r="4" fill="#7f8c8d"/> <!-- Pin 1 Mark -->
      <text x="400" y="215" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ecf0f1">ARM STM32F4</text>
      <text x="400" y="235" text-anchor="middle" font-family="monospace" font-size="9" fill="#bdc3c7">U101 - LOT: 2026A</text>
    </g>

    <!-- Visual Hint on Misalignment -->
    <text x="400" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f1c40f">[ VÙNG LINH KIỆN U101 ]</text>
  </g>

  <!-- ============================================================== -->
  <!-- CAPACITOR C12 - DEFECT COLD SOLDER JOINT                       -->
  <!-- Center at x=176 (22%), y=340 (68%)                             -->
  <!-- ============================================================== -->
  <g id="capacitor-c12-cold-solder" transform="translate(140, 310)">
    <!-- Silk screen outline -->
    <rect x="0" y="0" width="72" height="60" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="36" y="-8" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fff">C12 (100uF)</text>
    
    <!-- Good solder joint on Left pad -->
    <rect x="-6" y="16" width="16" height="28" fill="#d5dbdb" stroke="#27ae60" stroke-width="2" rx="2"/>
    
    <!-- Capacitor Body -->
    <rect x="10" y="10" width="52" height="40" rx="4" fill="#d35400" stroke="#a04000" stroke-width="1.5" filter="url(#pcbShadow)"/>
    <line x1="22" y1="10" x2="22" y2="50" stroke="#f39c12" stroke-width="3"/>

    <!-- Cold / Cracked Solder Pad on Right (DEFECT at x=22%, y=68% relative to board) -->
    <rect x="62" y="16" width="16" height="28" fill="#7f8c8d" stroke="#c0392b" stroke-width="2" rx="2"/>
    <!-- Crack line in solder -->
    <path d="M 64 24 L 70 30 L 66 38" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="70" cy="30" r="3" fill="#e74c3c"/>
  </g>

  <!-- Other SMD components (Normal) -->
  <!-- Resistor array -->
  <g transform="translate(600, 200)">
    <text x="30" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#fff">R21-R24</text>
    <rect x="10" y="5" width="40" height="15" fill="#2c3e50" stroke="#bdc3c7" stroke-width="2"/>
    <text x="30" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">103</text>
    
    <rect x="10" y="30" width="40" height="15" fill="#2c3e50" stroke="#bdc3c7" stroke-width="2"/>
    <text x="30" y="41" text-anchor="middle" font-family="monospace" font-size="8" fill="#fff">472</text>
  </g>

  <!-- Crystal Oscillator -->
  <g transform="translate(250, 320)">
    <rect x="0" y="0" width="50" height="30" rx="5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
    <text x="25" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2c3e50">16.000</text>
    <text x="25" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">Y1</text>
  </g>
</svg>

