<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for Industrial Finish -->
    <linearGradient id="metalPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="50%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#1e272e" />
    </linearGradient>
    <radialGradient id="redMushroom" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="60%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#962d22" />
    </radialGradient>
    <radialGradient id="greenBtn" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </radialGradient>
    <radialGradient id="yellowBtn" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f1c40f" />
      <stop offset="100%" stop-color="#d4ac0d" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Panel Casing -->
  <rect x="10" y="10" width="780" height="480" rx="16" fill="url(#metalPanel)" stroke="#7f8c8d" stroke-width="4" filter="url(#dropShadow)" />
  <rect x="25" y="25" width="750" height="450" rx="10" fill="#2d3436" stroke="#485460" stroke-width="2" />

  <!-- Industrial Bolts -->
  <circle cx="35" cy="35" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="765" cy="35" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="35" cy="465" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="765" cy="465" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="45" y="40" width="480" height="42" rx="6" fill="#1e272e" stroke="#00d2d3" stroke-width="1.5"/>
  <text x="60" y="67" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#00d2d3">SMT MOUNTER HIGH-SPEED NPM-D3 | BẢNG ĐIỀU KHIỂN CHÍNH</text>
  
  <!-- Status LEDs -->
  <circle cx="460" cy="61" r="7" fill="#2ed573" filter="url(#dropShadow)"/>
  <text x="475" y="66" font-family="sans-serif" font-size="11" fill="#a4b0be">RUN</text>

  <!-- Left: Industrial Gauge & Readout -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="220" height="330" rx="8" fill="#1e272e" stroke="#485460" stroke-width="1.5"/>
    <text x="20" y="30" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f1f2f6">ÁP SUẤT KHÍ NÉN (PNEUMATIC)</text>
    
    <!-- Pressure Meter Gauge -->
    <circle cx="110" cy="115" r="65" fill="#f5f6fa" stroke="#2f3542" stroke-width="6"/>
    <path d="M 65 145 A 55 55 0 1 1 155 145" fill="none" stroke="#747d8c" stroke-width="4"/>
    <!-- Needle pointing to 0.58 MPa -->
    <line x1="110" y1="115" x2="135" y2="75" stroke="#e84118" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="110" cy="115" r="8" fill="#2f3542"/>
    <text x="110" y="145" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#2f3542">0.58 MPa</text>

    <!-- Digital Status Box -->
    <rect x="20" y="200" width="180" height="105" rx="6" fill="#000" stroke="#00a8ff" stroke-width="1.5"/>
    <text x="35" y="225" font-family="Courier, monospace" font-size="12" fill="#00d2d3">ESD GROUND: OK</text>
    <text x="35" y="247" font-family="Courier, monospace" font-size="12" fill="#2ed573">DOOR LOCK: ENGAGED</text>
    <text x="35" y="269" font-family="Courier, monospace" font-size="12" fill="#ffa502">TEMP: 23.8 °C</text>
    <text x="35" y="291" font-family="Courier, monospace" font-size="12" fill="#00d2d3">FEEDER SLOTS: 64/64</text>
  </g>

  <!-- Center: Track Display Simulation -->
  <g transform="translate(290, 110)">
    <rect x="0" y="0" width="220" height="330" rx="8" fill="#000" stroke="#3742fa" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="25" fill="#2f3542" rx="4"/>
    <text x="20" y="27" font-family="sans-serif" font-weight="bold" font-size="11" fill="#70a1ff">HỆ THỐNG GẮN CHIP PCB</text>
    
    <!-- Schematic animation lines -->
    <rect x="25" y="60" width="170" height="110" rx="4" fill="#0c2461" stroke="#1e3799" stroke-width="1"/>
    <rect x="45" y="80" width="130" height="70" rx="2" fill="#0a3d62" stroke="#82ccdd" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="65" y="120" font-family="sans-serif" font-weight="bold" font-size="12" fill="#82ccdd">PCB IN POSITION</text>

    <!-- Real-time feed status -->
    <rect x="20" y="195" width="180" height="115" rx="4" fill="#1e272e" stroke="#57606f" stroke-width="1"/>
    <text x="30" y="220" font-family="sans-serif" font-size="11" fill="#ced6e0">Tốc độ: 42,000 CPH</text>
    <text x="30" y="245" font-family="sans-serif" font-size="11" fill="#ced6e0">Nozzle #1: Ready</text>
    <text x="30" y="270" font-family="sans-serif" font-size="11" fill="#ced6e0">Nozzle #2: Ready</text>
    <text x="30" y="295" font-family="sans-serif" font-weight="bold" font-size="11" fill="#2ed573">TRẠNG THÁI: CHỜ LỆNH</text>
  </g>

  <!-- Right: Control Push Buttons (Includes Emergency Stop) -->
  <g transform="translate(530, 40)">
    <!-- Control Sub-Panel -->
    <rect x="0" y="0" width="225" height="400" rx="12" fill="#1e272e" stroke="#747d8c" stroke-width="2"/>
    <text x="112" y="32" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f1f2f6">KHỐI THAO TÁC CƠ HỌC</text>

    <!-- ============================================== -->
    <!-- EMERGENCY STOP BUTTON (Target: Center at x=596, y=160 -> Relative to 800x500 is x=74.5%, y=32.0%) -->
    <!-- ============================================== -->
    <g id="emergency-stop-group">
      <!-- Yellow Warning Ring -->
      <circle cx="66" cy="120" r="54" fill="#f1c40f" stroke="#d35400" stroke-width="4" filter="url(#dropShadow)"/>
      <text x="66" y="80" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9" fill="#000">EMERGENCY</text>
      <text x="66" y="167" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9" fill="#000">STOP</text>
      
      <!-- Big Red Mushroom Knob -->
      <circle cx="66" cy="120" r="40" fill="url(#redMushroom)" stroke="#78281f" stroke-width="4" filter="url(#dropShadow)"/>
      <!-- Inner circular ridge and arrows -->
      <circle cx="66" cy="120" r="28" fill="none" stroke="#f5b7b1" stroke-width="2.5" stroke-dasharray="8 6"/>
      <polygon points="66,95 72,102 60,102" fill="#fff"/>
      <text x="66" y="125" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#fff">RESET</text>
    </g>

    <!-- PAUSE / STEP BUTTON -->
    <g transform="translate(26, 210)">
      <circle cx="40" cy="30" r="28" fill="#2d3436" stroke="#636e72" stroke-width="3" filter="url(#dropShadow)"/>
      <circle cx="40" cy="30" r="22" fill="url(#yellowBtn)" stroke="#b7950b" stroke-width="2"/>
      <text x="40" y="34" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#000">PAUSE</text>
      <text x="85" y="34" font-family="sans-serif" font-size="11" fill="#dfe4ea">TẠM DỪNG</text>
    </g>

    <!-- START / RUN BUTTON -->
    <g transform="translate(26, 290)">
      <circle cx="40" cy="30" r="28" fill="#2d3436" stroke="#636e72" stroke-width="3" filter="url(#dropShadow)"/>
      <circle cx="40" cy="30" r="22" fill="url(#greenBtn)" stroke="#1e8449" stroke-width="2"/>
      <polygon points="36,20 48,30 36,40" fill="#fff"/>
      <text x="85" y="34" font-family="sans-serif" font-size="11" fill="#2ed573" font-weight="bold">START / CHẠY</text>
    </g>

    <!-- Key Lock -->
    <g transform="translate(46, 365)">
      <circle cx="20" cy="15" r="14" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
      <rect x="18" y="7" width="4" height="16" fill="#1e272e"/>
      <text x="50" y="20" font-family="sans-serif" font-size="10" fill="#747d8c">AUTO / MANUAL</text>
    </g>
  </g>
</svg>

